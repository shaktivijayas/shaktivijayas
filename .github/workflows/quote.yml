name: Rotate Quote

on:
  schedule:
    - cron: '0 */3 * * *'   # regenerates a new random quote every 3 hours
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate quote SVGs
        run: python3 generate_quote_svg.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quote-dark.svg quote-light.svg
          git diff --staged --quiet || git commit -m "chore: rotate quote"
          git push
