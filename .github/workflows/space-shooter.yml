name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'   # regenerates daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'
      - name: Sync with the commit the action just pushed
        run: git pull --ff-only
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: pip install Pillow
      - name: Desaturate game GIF to match monochrome theme
        run: python3 desaturate_gif.py game.gif
      - name: Commit desaturated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game.gif
          git diff --staged --quiet || git commit -m "chore: desaturate space shooter gif"
          git push
