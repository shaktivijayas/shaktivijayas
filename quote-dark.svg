<svg xmlns="http://www.w3.org/2000/svg" width="760" height="126" viewBox="0 0 760 126">
  <style>
    .quote { font: italic 400 18px 'Segoe UI', ui-sans-serif, sans-serif; fill: #e6e6e6; }
    .author { font: 600 15px 'Segoe UI', ui-sans-serif, sans-serif; fill: #e6e6e6; opacity: 0.75; }
  </style>
  <text text-anchor="middle" class="quote" x="50%" y="40">
    <tspan x="50%" dy="0">“How can you move forward if you keep regretting the</tspan>
    <tspan x="50%" dy="26">past?”</tspan>
  </text>
  <text text-anchor="middle" class="author" x="50%" y="116">— Edward Elric</text>
</svg>
