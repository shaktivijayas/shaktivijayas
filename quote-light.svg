<svg xmlns="http://www.w3.org/2000/svg" width="760" height="126" viewBox="0 0 760 126">
  <style>
    .quote { font: italic 400 18px 'Segoe UI', ui-sans-serif, sans-serif; fill: #1a1a1a; }
    .author { font: 600 15px 'Segoe UI', ui-sans-serif, sans-serif; fill: #1a1a1a; opacity: 0.75; }
  </style>
  <text text-anchor="middle" class="quote" x="50%" y="40">
    <tspan x="50%" dy="0">“If you don't like your destiny, don't accept it. Instead,</tspan>
    <tspan x="50%" dy="26">have the courage to change it the way you want it to be.”</tspan>
  </text>
  <text text-anchor="middle" class="author" x="50%" y="116">— Naruto Uzumaki</text>
</svg>
