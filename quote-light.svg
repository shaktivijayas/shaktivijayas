<svg xmlns="http://www.w3.org/2000/svg" width="760" height="100" viewBox="0 0 760 100">
  <style>
    .quote { font: italic 400 18px 'Segoe UI', ui-sans-serif, sans-serif; fill: #1a1a1a; }
    .author { font: 600 15px 'Segoe UI', ui-sans-serif, sans-serif; fill: #1a1a1a; opacity: 0.75; }
  </style>
  <text text-anchor="middle" class="quote" x="50%" y="40">
    <tspan x="50%" dy="0">“A dropout will beat a genius through hard work.”</tspan>
  </text>
  <text text-anchor="middle" class="author" x="50%" y="90">— Rock Lee</text>
</svg>
